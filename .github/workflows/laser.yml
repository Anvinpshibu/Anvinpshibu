name: laser

# Re-burns the contribution graph every 6 hours and publishes it to the `output` branch,
# which the README reads from.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/readme/**", ".github/workflows/laser.yml"]

permissions:
  contents: write

concurrency:
  group: laser
  cancel-in-progress: true

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - name: Burn the graph
        run: python scripts/readme/laser.py --user "${{ github.repository_owner }}" --out dist/laser-commits.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: "Burn the contribution graph"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
